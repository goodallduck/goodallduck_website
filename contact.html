<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT — 꾸더덕 GoodAllDuck</title>
  <meta name="description" content="꾸더덕 영상 제작 문의.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="꾸더덕 GoodAllDuck">
  <meta property="og:description" content="토크 예능 · 인터뷰 · VLOG 영상 편집.">
  <meta property="og:image" content="https://goodallduck.com/assets/img/og.jpg">
  <meta property="og:url" content="https://goodallduck.com/contact.html">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="assets/img/logo/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body data-page="contact">

  <header class="header">
    <div class="header__inner">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
      <a href="./" class="brand" aria-label="꾸더덕 홈"><img src="assets/img/logo/logo.png" srcset="assets/img/logo/logo@2x.png 2x" alt="꾸더덕 GoodAllDuck" width="360" height="363"></a>
      <a href="contact.html" class="pill pill--dark header__cta">문의하기</a>
    </div>
  </header>

  <nav class="menu" id="menu" aria-label="주요 메뉴" hidden>
    <ul class="menu__list">
      <li><a href="about.html"><span>ABOUT</span><small>소개</small></a></li>
      <li><a href="work.html"><span>WORK</span><small>작업물</small></a></li>
      <li><a href="contact.html"><span>CONTACT</span><small>문의</small></a></li>
    </ul>
    <p class="menu__mail"><a href="mailto:goodallduck@gmail.com">goodallduck@gmail.com</a></p>
  </nav>

  <main>
    <section class="page-head">
      <div class="wrap contact">
        <div class="contact__side">
          <h1 class="page-title">CONTACT</h1>
          <p class="contact__lead">편하게 남겨주세요.<br>확인 후 회신드릴게요.</p>
          <a class="contact__mail" href="mailto:goodallduck@gmail.com">goodallduck@gmail.com</a>
        </div>
        <form class="form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="contact">
          <p class="hp"><label>비워두세요 <input name="bot-field"></label></p>
          <fieldset class="chips">
            <legend>문의 유형</legend>
            <label><input type="radio" name="type" value="영상 편집" checked><span>영상 편집</span></label>
            <label><input type="radio" name="type" value="토크 · 예능"><span>토크 · 예능</span></label>
            <label><input type="radio" name="type" value="인터뷰"><span>인터뷰</span></label>
            <label><input type="radio" name="type" value="숏폼"><span>숏폼</span></label>
            <label><input type="radio" name="type" value="기타"><span>기타</span></label>
          </fieldset>
          <div class="form__row">
            <label class="field"><span>이름 / 회사 *</span><input type="text" name="name" required autocomplete="name"></label>
            <label class="field"><span>이메일 *</span><input type="email" name="email" required autocomplete="email"></label>
          </div>
          <div class="form__row">
            <label class="field"><span>연락처</span><input type="tel" name="phone" autocomplete="tel"></label>
            <label class="field"><span>희망 일정</span><input type="text" name="schedule" placeholder="예: 11월 말"></label>
          </div>
          <label class="field"><span>내용 *</span><textarea name="message" rows="4" required placeholder="영상 종류, 분량, 참고 링크"></textarea></label>
          <label class="consent"><input type="checkbox" name="consent" required><span>문의 응대를 위한 개인정보 수집 · 이용에 동의합니다.</span></label>
          <button type="submit" class="pill pill--orange pill--lg form__submit">보내기</button>
          <p class="form__status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <img src="assets/img/logo/logo.png" alt="꾸더덕 GoodAllDuck" width="72" height="73" class="footer__logo">
      <a href="mailto:goodallduck@gmail.com">goodallduck@gmail.com</a>
      <p>© 2026 GoodAllDuck</p>
    </div>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel">
      <button class="modal__close" data-close aria-label="닫기"></button>
      <div class="modal__video" id="modalVideo"></div>
      <div class="modal__info">
        <p class="tag" id="modalCat"></p>
        <h3 class="modal__title" id="modalTitle"></h3>
        <p class="meta" id="modalMeta"></p>
        <p class="modal__desc" id="modalDesc"></p>
        <a class="pill" id="modalLink" href="#" target="_blank" rel="noopener">YouTube에서 보기 ↗</a>
      </div>
    </div>
  </div>

  <script src="assets/js/works.js?v=7"></script>
  <script src="assets/js/main.js?v=7" defer></script>
</body>
</html>
